        <text x="1046" y="323" fill="#5c7074" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ABU DHABI</text>
        <text x="1046" y="374" fill="#0c2730" font-family="Georgia, ui-serif, serif" font-size="48" font-weight="600">78.9</text>
        <text x="1150" y="373" fill="#5c7074" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">/ 100</text>
        <rect x="1046" y="391" width="244" height="7" rx="3.5" fill="#dce8e4"/>
