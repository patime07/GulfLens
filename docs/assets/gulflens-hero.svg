          <rect x="128" y="125" width="308" height="8" rx="4" fill="#2c9da0"/>
          <rect x="128" y="136" width="294" height="4" rx="2" fill="#628fbd"/>
          <rect x="128" y="149" width="350" height="8" rx="4" fill="#e5eeea"/>
          <rect x="128" y="149" width="301" height="8" rx="4" fill="#2c9da0"/>
          <rect x="128" y="160" width="280" height="4" rx="2" fill="#628fbd"/>
