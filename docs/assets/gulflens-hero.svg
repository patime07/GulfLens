        <rect x="496" y="49" width="70" height="112" rx="14" fill="#dff1e8"/>
        <text x="531" y="84" text-anchor="middle" fill="#1b7c66" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" font-weight="700">NEAR TIE</text>
        <text x="531" y="118" text-anchor="middle" fill="#0c2730" font-family="Georgia, ui-serif, serif" font-size="28" font-weight="600">0.7</text>
        <text x="531" y="141" text-anchor="middle" fill="#5c7074" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">point gap</text>
