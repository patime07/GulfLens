<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">GulfLens interface preview</title>
  <desc id="desc">A polished preview of GulfLens comparing Dubai and Abu Dhabi for a local market-entry scenario.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07171d"/>
      <stop offset="0.58" stop-color="#0c2730"/>
      <stop offset="1" stop-color="#0e444d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62cdd0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#68d1ae" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="scoreA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#126f78"/>
      <stop offset="1" stop-color="#62cdd0"/>
    </linearGradient>
    <linearGradient id="scoreB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21476f"/>
      <stop offset="1" stop-color="#80add8"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#d8edeb" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c2730" flood-opacity=".12"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="690" y="72" width="670" height="616" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="28" fill="url(#grid)"/>
  <circle cx="151" cy="84" r="290" fill="url(#glow)" opacity=".55"/>
  <circle cx="584" cy="758" r="330" fill="#126f78" opacity=".1"/>
  <path d="M79 632c164-61 267-36 387 26 65 34 127 42 188 16" fill="none" stroke="#68d1ae" stroke-opacity=".13" stroke-width="2"/>

  <g transform="translate(80 74)">
    <g>
      <rect width="56" height="56" rx="17" fill="#d8edeb"/>
      <circle cx="28" cy="28" r="15" fill="none" stroke="#126f78" stroke-width="5"/>
      <path d="M37 39l10 10" fill="none" stroke="#126f78" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="74" y="25" fill="#f2f7f4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700" letter-spacing="1.2">GULFLENS</text>
    <text x="74" y="47" fill="#9fc1bf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">UAE MARKET ENTRY</text>
  </g>

  <g transform="translate(80 210)">
    <rect width="294" height="34" rx="17" fill="#18343d" stroke="#31545a"/>
    <circle cx="18" cy="17" r="5" fill="#68d1ae"/>
    <text x="32" y="22" fill="#b9cfcd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">DUBAI + ABU DHABI</text>

    <text y="104" fill="#f2f7f4" font-family="Georgia, ui-serif, serif" font-size="60" font-weight="600">Turn UAE market</text>
    <text y="171" fill="#f2f7f4" font-family="Georgia, ui-serif, serif" font-size="60" font-weight="600">entry into a clear,</text>
    <text y="238" fill="#6ed2c3" font-family="Georgia, ui-serif, serif" font-size="60" font-weight="600">confident decision.</text>

    <text y="294" fill="#b9c9c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">A guided, multilingual assessment for comparing</text>
    <text y="324" fill="#b9c9c8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">UAE market-entry routes, city fit and trade-offs.</text>

