  <circle cx="494" cy="384" r="14" fill="#d8edeb" stroke="#78a19f"/>
  <path d="M489 384h10m-4-4 4 4-4 4" fill="none" stroke="#126f78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M914 384h56" stroke="#78a19f" stroke-width="2" stroke-dasharray="4 7"/>
