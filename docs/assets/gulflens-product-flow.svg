<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">GulfLens product journey</title>
  <desc id="desc">Three GulfLens interface panels showing track selection, transparent analysis and Dubai versus Abu Dhabi results.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/>
      <stop offset="1" stop-color="#e5eeea"/>
    </linearGradient>
    <linearGradient id="analysis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2730"/>
      <stop offset="1" stop-color="#123f48"/>
    </linearGradient>
    <linearGradient id="tealBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#126f78"/>
      <stop offset="1" stop-color="#62cdd0"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c2730" flood-opacity=".15"/>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#126f78" opacity=".1"/>
    </pattern>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#canvas)"/>
  <rect width="1440" height="760" rx="28" fill="url(#dots)"/>
  <text x="720" y="58" text-anchor="middle" fill="#126f78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2.2">A GUIDED, EXPLAINABLE EXPERIENCE</text>
  <text x="720" y="98" text-anchor="middle" fill="#0c2730" font-family="Georgia, ui-serif, serif" font-size="34" font-weight="600">From business profile to side-by-side decision</text>

